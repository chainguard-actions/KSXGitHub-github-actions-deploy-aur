name: Test basic input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal PKGBUILD file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-pkg"
          cat > "$GITHUB_WORKSPACE/test-pkg/PKGBUILD" << 'EOF'
          # Maintainer: Test User <test@example.com>
          pkgname=test-package
          pkgver=1.0.0
          pkgrel=1
          pkgdesc="A test package"
          arch=('any')
          url="https://example.com"
          license=('MIT')
          source=()
          sha256sums=()

          package() {
            true
          }
          EOF

      - name: Generate a dummy RSA key for input coverage
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_aur_key -N "" -C "test@example.com"
          echo "DUMMY_SSH_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test_aur_key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - id: deploy
        uses: .
        continue-on-error: true
        with:
          pkgname: test-package
          pkgbuild: test-pkg/PKGBUILD
          commit_username: Test User
          commit_email: test@example.com
          ssh_private_key: ${{ env.DUMMY_SSH_KEY }}
          commit_message: Test commit from CI
          allow_empty_commits: 'false'
          force_push: 'false'
          test: 'false'
          updpkgsums: 'false'

      - name: Assert action was invoked (may fail due to no real AUR access)
        run: |
          echo "Action outcome: ${{ steps.deploy.outcome }}"
          # The action is expected to fail because we have no real AUR SSH access.
          # We only verify that the action was invoked with all required inputs.
          if [ "${{ steps.deploy.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with all required inputs"
