name: Test missing commit_email validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with empty commit_email (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          pkgname: 'test-pkg'
          pkgbuild: 'PKGBUILD'
          commit_username: 'Test User'
          commit_email: ''
          ssh_private_key: 'fake-key'
      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when commit_email is empty"
            exit 1
          fi
          echo "PASS: action correctly failed when commit_email is empty"
