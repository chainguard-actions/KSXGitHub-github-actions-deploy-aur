name: Test basic usage - required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create PKGBUILD fixture and SSH key
        run: |
          mkdir -p /tmp/aur-test
          cat > /tmp/aur-test/PKGBUILD << 'EOF'
          # Maintainer: Test User <test@example.com>
          pkgname=test-package
          pkgver=1.0.0
          pkgrel=1
          pkgdesc="A test package"
          arch=('any')
          url="https://example.com"
          license=('MIT')
          source=()
          sha256sums=()

          package() {
            true
          }
          EOF

          ssh-keygen -t ed25519 -f /tmp/test_ssh_key -N "" -C "test@example.com"
          # Store the private key content for use in the next step
          {
            echo 'DUMMY_SSH_KEY<<EOF_KEY'
            cat /tmp/test_ssh_key
            echo 'EOF_KEY'
          } >> "$GITHUB_ENV"

      - id: action
        uses: .
        continue-on-error: true
        with:
          pkgname: test-package
          pkgbuild: /tmp/aur-test/PKGBUILD
          commit_username: test-user
          commit_email: test@example.com
          ssh_private_key: ${{ env.DUMMY_SSH_KEY }}
          commit_message: 'Test commit'
          allow_empty_commits: 'false'
          force_push: 'false'

      - name: Assert action ran (expected to fail at SSH/AUR stage)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail because we don't have real AUR credentials
          # but we verify it ran and was not skipped
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome: ${{ steps.action.outcome }})"
