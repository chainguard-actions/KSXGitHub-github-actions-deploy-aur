name: Test asset_dir must be a directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with asset_dir pointing to a non-existent directory (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          pkgname: 'test-pkg'
          asset_dir: '/tmp/nonexistent-dir-xyz'
          commit_username: 'Test User'
          commit_email: 'test@example.com'
          ssh_private_key: 'fake-key'
      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when asset_dir is not a directory"
            exit 1
          fi
          echo "PASS: action correctly failed when asset_dir is not a directory"
