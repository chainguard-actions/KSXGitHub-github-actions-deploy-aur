name: Test default input values
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake PKGBUILD for testing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/pkgbuild"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/pkgbuild/PKGBUILD" << 'EOF'
          # Maintainer: Test User <test@example.com>
          pkgname=test-package
          pkgver=1.0.0
          pkgrel=1
          pkgdesc="A test package"
          arch=('any')
          url="https://example.com"
          license=('MIT')
          source=()
          sha256sums=()

          package() {
            echo "test"
          }
          EOF

      - name: Run action with only required inputs and defaults (expect failure at SSH/network step)
        id: action
        uses: .
        continue-on-error: true
        with:
          pkgname: test-package
          pkgbuild: tests/fixtures/pkgbuild/PKGBUILD
          commit_username: "Test User"
          commit_email: "test@example.com"
          ssh_private_key: "this-is-not-a-valid-ssh-key"
          # All optional inputs use defaults:
          # updpkgsums: false
          # test: false
          # allow_empty_commits: false
          # force_push: false
          # commit_message: 'Update PKGBUILD and .SRCINFO with GitHub Actions'
          # ssh_keyscan_types: 'rsa,ecdsa,ed25519'

      - name: Assert action failed (expected - no real AUR credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: Expected action to fail without real AUR credentials, but it succeeded"
            exit 1
          fi
          echo "PASS: Action correctly failed without real AUR credentials (expected behavior in test environment)"
