name: Test default input values
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal PKGBUILD for testing
        run: |
          mkdir -p /tmp/pkgbuild-test
          cat > /tmp/pkgbuild-test/PKGBUILD << 'EOF'
          pkgname=my-test-pkg
          pkgver=2.0.0
          pkgrel=1
          pkgdesc="My test package"
          arch=('x86_64')
          url="https://example.com"
          license=('GPL')
          package() {
            true
          }
          EOF

      - name: Run action with only required inputs and defaults (expect failure at SSH stage)
        id: action
        uses: .
        continue-on-error: true
        with:
          pkgname: my-test-pkg
          pkgbuild: /tmp/pkgbuild-test/PKGBUILD
          commit_username: CI Bot
          commit_email: ci@example.com
          ssh_private_key: "-----BEGIN OPENSSH PRIVATE KEY-----\nfake-key-data\n-----END OPENSSH PRIVATE KEY-----"
          # All optional inputs use defaults:
          # updpkgsums: false
          # test: false
          # allow_empty_commits: false
          # force_push: false
          # commit_message: 'Update PKGBUILD and .SRCINFO with GitHub Actions'
          # ssh_keyscan_types: 'rsa,ecdsa,ed25519'

      - name: Assert action failed (expected - no real AUR SSH key)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail without valid AUR SSH credentials"
            exit 1
          fi
          echo "PASS: action correctly failed at SSH/network stage (no real AUR credentials)"
