name: Test input validation
on:
  workflow_dispatch:

jobs:
  test-missing-pkgname:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action fails when pkgname is empty (validation error)
      - id: action
        uses: .
        continue-on-error: true
        with:
          pkgname: ''
          pkgbuild: pristine/KSXGitHub--github-actions-deploy-aur/v4.1.0/tests/fixtures/PKGBUILD
          commit_username: 'Test User'
          commit_email: 'test@example.com'
          ssh_private_key: 'dummy-key'

      - name: Assert action failed due to empty pkgname
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when pkgname is empty"
            exit 1
          fi
          echo "PASS: action correctly failed when pkgname is empty"

  test-missing-commit-username:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action fails when commit_username is empty
      - id: action
        uses: .
        continue-on-error: true
        with:
          pkgname: 'test-package'
          pkgbuild: pristine/KSXGitHub--github-actions-deploy-aur/v4.1.0/tests/fixtures/PKGBUILD
          commit_username: ''
          commit_email: 'test@example.com'
          ssh_private_key: 'dummy-key'

      - name: Assert action failed due to empty commit_username
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when commit_username is empty"
            exit 1
          fi
          echo "PASS: action correctly failed when commit_username is empty"

  test-missing-commit-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action fails when commit_email is empty
      - id: action
        uses: .
        continue-on-error: true
        with:
          pkgname: 'test-package'
          pkgbuild: pristine/KSXGitHub--github-actions-deploy-aur/v4.1.0/tests/fixtures/PKGBUILD
          commit_username: 'Test User'
          commit_email: ''
          ssh_private_key: 'dummy-key'

      - name: Assert action failed due to empty commit_email
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when commit_email is empty"
            exit 1
          fi
          echo "PASS: action correctly failed when commit_email is empty"

  test-missing-ssh-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action fails when ssh_private_key is empty
      - id: action
        uses: .
        continue-on-error: true
        with:
          pkgname: 'test-package'
          pkgbuild: pristine/KSXGitHub--github-actions-deploy-aur/v4.1.0/tests/fixtures/PKGBUILD
          commit_username: 'Test User'
          commit_email: 'test@example.com'
          ssh_private_key: ''

      - name: Assert action failed due to empty ssh_private_key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when ssh_private_key is empty"
            exit 1
          fi
          echo "PASS: action correctly failed when ssh_private_key is empty"
