name: Test missing pkgname input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy PKGBUILD
        run: |
          cat > /tmp/PKGBUILD << 'EOF'
          pkgname=test-pkg
          pkgver=1.0.0
          pkgrel=1
          pkgdesc="Test package"
          arch=('any')
          url="https://example.com"
          license=('MIT')
          EOF

      - name: Run action with empty pkgname (expect failure)
        id: action
        continue-on-error: true
        uses: .
        with:
          pkgname: ''
          pkgbuild: /tmp/PKGBUILD
          commit_username: 'Test User'
          commit_email: 'test@example.com'
          ssh_private_key: 'dummy-key'

      - name: Assert action failed due to empty pkgname
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with empty pkgname, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with empty pkgname"
