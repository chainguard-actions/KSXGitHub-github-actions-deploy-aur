name: Test action fails when PKGBUILD path does not exist
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate a real SSH key for testing
        run: |
          ssh-keygen -t ed25519 -f /tmp/test_aur_key -N "" -C "test@example.com"
          echo "TEST_SSH_KEY<<EOF" >> "$GITHUB_ENV"
          cat /tmp/test_aur_key >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - id: action
        uses: .
        continue-on-error: true
        with:
          pkgname: test-package
          pkgbuild: tests/fixtures/nonexistent/PKGBUILD
          commit_username: Test User
          commit_email: test@example.com
          ssh_private_key: ${{ env.TEST_SSH_KEY }}
          commit_message: "Test commit"

      - name: Assert action failed because PKGBUILD does not exist
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with missing PKGBUILD, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when PKGBUILD path does not exist"
