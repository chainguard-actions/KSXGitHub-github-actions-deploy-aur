name: Test basic AUR deploy inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal PKGBUILD file
        run: |
          cat > /tmp/PKGBUILD <<'EOF'
          # Maintainer: Test User <test@example.com>
          pkgname=test-package
          pkgver=1.0.0
          pkgrel=1
          pkgdesc="A test package"
          arch=('any')
          url="https://example.com"
          license=('MIT')
          source=()
          sha256sums=()

          package() {
            true
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          pkgname: test-package
          pkgbuild: /tmp/PKGBUILD
          commit_username: Test User
          commit_email: test@example.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY || 'dummy-key-for-coverage' }}
          commit_message: Test commit from CI
          allow_empty_commits: 'false'
          force_push: 'false'

      - name: Assert action ran (input coverage check)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          echo "PASS: All required inputs were provided to the action"
