name: Test failure when ssh_private_key is missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal PKGBUILD for testing
        run: |
          cat > /tmp/PKGBUILD << 'EOF'
          pkgname=test-package
          pkgver=1.0.0
          pkgrel=1
          pkgdesc="A test package"
          arch=('any')
          url="https://example.com"
          license=('MIT')
          source=()
          sha256sums=()
          package() {
            true
          }
          EOF

      # Provide an empty ssh_private_key — the action should fail with an error
      # about ssh_private_key being empty (assert_non_empty check in build.sh)
      - id: action
        uses: .
        continue-on-error: true
        with:
          pkgname: test-package
          pkgbuild: /tmp/PKGBUILD
          commit_username: Test User
          commit_email: test@example.com
          ssh_private_key: ''
          commit_message: Test commit

      - name: Assert action failed due to empty ssh_private_key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when ssh_private_key is empty, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when ssh_private_key was empty"
