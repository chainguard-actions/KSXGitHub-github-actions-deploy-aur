name: Test basic flow with valid inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy PKGBUILD
        run: |
          mkdir -p /tmp/pkgbuild-dir
          cat > /tmp/pkgbuild-dir/PKGBUILD << 'EOF'
          pkgname=test-pkg
          pkgver=1.0.0
          pkgrel=1
          pkgdesc="Test package"
          arch=('any')
          url="https://example.com"
          license=('MIT')
          EOF

      - name: Run action with valid inputs (expect failure at network stage, not input validation)
        id: action
        continue-on-error: true
        uses: .
        with:
          pkgname: 'test-pkg'
          pkgbuild: /tmp/pkgbuild-dir/PKGBUILD
          commit_username: 'Test User'
          commit_email: 'test@example.com'
          ssh_private_key: 'dummy-key-that-will-fail-at-ssh-keygen'
          commit_message: 'Test commit'
          allow_empty_commits: 'false'
          force_push: 'false'
          ssh_keyscan_types: 'rsa,ecdsa,ed25519'

      - name: Assert action ran (failed at network/SSH stage, not input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (no real AUR access), but it should fail
          # at the SSH/network stage, not at input validation.
          # Either failure or success is acceptable here — what matters is
          # that the action was invoked and processed valid inputs.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with valid inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
