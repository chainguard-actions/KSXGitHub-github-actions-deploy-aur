name: Test invalid SSH key handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake PKGBUILD for testing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/pkgbuild"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/pkgbuild/PKGBUILD" << 'EOF'
          # Maintainer: Test User <test@example.com>
          pkgname=test-package
          pkgver=1.0.0
          pkgrel=1
          pkgdesc="A test package"
          arch=('any')
          url="https://example.com"
          license=('MIT')
          source=()
          sha256sums=()

          package() {
            echo "test"
          }
          EOF

      - name: Run action with invalid SSH key (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          pkgname: test-package
          pkgbuild: tests/fixtures/pkgbuild/PKGBUILD
          commit_username: "Test User"
          commit_email: "test@example.com"
          ssh_private_key: "this-is-not-a-valid-ssh-key"
          commit_message: "Test commit"

      - name: Assert action failed due to invalid SSH key
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: Expected action to fail with invalid SSH key, but it succeeded"
            exit 1
          fi
          echo "PASS: Action correctly failed with invalid SSH key"
