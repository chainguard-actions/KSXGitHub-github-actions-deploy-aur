name: Test action fails when AUR package does not exist
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal PKGBUILD fixture
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/pkgbuild"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/pkgbuild/PKGBUILD" <<'EOF'
          # Maintainer: Test User <test@example.com>
          pkgname=this-package-does-not-exist-on-aur-xyz123
          pkgver=1.0.0
          pkgrel=1
          pkgdesc="A test package"
          arch=('any')
          url="https://example.com"
          license=('MIT')
          source=()
          sha256sums=()

          package() {
            echo "test"
          }
          EOF

      - name: Generate a real SSH key for testing
        run: |
          ssh-keygen -t ed25519 -f /tmp/test_aur_key -N "" -C "test@example.com"
          echo "TEST_SSH_KEY<<EOF" >> "$GITHUB_ENV"
          cat /tmp/test_aur_key >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - id: action
        uses: .
        continue-on-error: true
        with:
          pkgname: this-package-does-not-exist-on-aur-xyz123
          pkgbuild: tests/fixtures/pkgbuild/PKGBUILD
          commit_username: Test User
          commit_email: test@example.com
          ssh_private_key: ${{ env.TEST_SSH_KEY }}
          commit_message: "Test commit"

      - name: Assert action failed because AUR package does not exist
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for nonexistent AUR package, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for nonexistent AUR package"
