name: Test AUR clone failure with valid SSH key format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate a test SSH key pair
        id: keygen
        run: |
          ssh-keygen -t ed25519 -C "test@example.com" -f /tmp/test_aur_key -N ""
          echo "private_key<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/test_aur_key >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create a minimal PKGBUILD fixture
        run: |
          mkdir -p /tmp/test-pkgbuild
          cat > /tmp/test-pkgbuild/PKGBUILD << 'EOF'
          # Maintainer: Test User <test@example.com>
          pkgname=this-package-does-not-exist-in-aur-12345
          pkgver=1.0.0
          pkgrel=1
          pkgdesc="A test package"
          arch=('any')
          url="https://example.com"
          license=('MIT')
          source=()
          sha256sums=()
          package() {
            true
          }
          EOF

      - name: Run action with valid SSH key but non-existent AUR package (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          pkgname: this-package-does-not-exist-in-aur-12345
          pkgbuild: /tmp/test-pkgbuild/PKGBUILD
          commit_username: "Test User"
          commit_email: "test@example.com"
          ssh_private_key: ${{ steps.keygen.outputs.private_key }}
          commit_message: "Test commit"

      - name: Assert action failed (AUR clone or SSH should fail)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when cloning non-existent AUR package, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when AUR package does not exist"
