name: Test asset_dir and assets are mutually exclusive
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a fake asset_dir with PKGBUILD
        run: |
          mkdir -p /tmp/test-asset-dir
          echo "# fake PKGBUILD" > /tmp/test-asset-dir/PKGBUILD
      - name: Run action with both asset_dir and assets (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          pkgname: 'test-pkg'
          assets: 'some-file.txt'
          asset_dir: '/tmp/test-asset-dir'
          commit_username: 'Test User'
          commit_email: 'test@example.com'
          ssh_private_key: 'fake-key'
      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when both asset_dir and assets are specified"
            exit 1
          fi
          echo "PASS: action correctly failed when asset_dir and assets are both specified"
