name: Test basic invocation with valid inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires a real SSH key and AUR connectivity to fully succeed.
      # With valid (but fake) inputs, the action should pass input validation
      # and fail at the SSH key import or AUR network step — not at validation.
      # We use continue-on-error and verify the action at least starts correctly.
      - id: action
        uses: .
        continue-on-error: true
        with:
          pkgname: 'test-package'
          pkgbuild: ${{ github.workspace }}/pristine/KSXGitHub--github-actions-deploy-aur/v4.1.0/tests/fixtures/PKGBUILD
          commit_username: 'Test User'
          commit_email: 'test@example.com'
          ssh_private_key: 'not-a-real-key'
          commit_message: 'Test commit'
          allow_empty_commits: 'false'
          force_push: 'false'
          ssh_keyscan_types: 'rsa,ecdsa,ed25519'

      # The action should fail (no real SSH key / no AUR access), but it must
      # NOT fail with "Invalid Value: inputs.pkgname is empty" or similar
      # validation errors — those would indicate a misconfiguration in the test.
      - name: Assert action failed at network/SSH step, not at validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # In a test environment without AUR access, failure is expected.
          # The important thing is that the action ran (not skipped).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME, failure at network step is expected in test environment)"
