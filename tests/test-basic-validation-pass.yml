name: Test basic input validation passes with valid inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a PKGBUILD file for testing under workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-pkg-dir"
          printf 'pkgname=hello\npkgver=2.12.1\npkgrel=1\npkgdesc="A simple hello world program"\narch=("x86_64")\nurl="https://www.gnu.org/software/hello/"\nlicense=("GPL3")\nsource=()\nsha256sums=()\n' > "$GITHUB_WORKSPACE/test-pkg-dir/PKGBUILD"

      - id: action
        uses: .
        continue-on-error: true
        with:
          pkgname: hello
          pkgbuild: /github/workspace/test-pkg-dir/PKGBUILD
          commit_username: Test User
          commit_email: test@example.com
          ssh_private_key: fake-key-for-validation-test

      - name: Assert action failed at SSH/network step (not at validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (no real AUR credentials), but it must have
          # passed input validation to reach the SSH/network step.
          # We accept either failure (expected: no real AUR access) or success.
          # What we do NOT want is a validation error about missing/invalid inputs.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at SSH/network step as expected (no real AUR credentials)"
          else
            echo "PASS: action succeeded unexpectedly"
          fi
