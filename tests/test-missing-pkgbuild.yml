name: Test missing PKGBUILD file error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          pkgname: test-package
          pkgbuild: tests/fixtures/nonexistent/PKGBUILD
          commit_username: Test User
          commit_email: test@example.com
          ssh_private_key: "not-a-valid-key"

      - name: Assert action failed due to missing PKGBUILD or invalid SSH key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with missing PKGBUILD or invalid SSH key, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed"
