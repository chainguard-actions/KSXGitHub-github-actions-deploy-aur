name: Test missing required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal PKGBUILD fixture
        run: |
          mkdir -p /tmp/test-pkgbuild
          cat > /tmp/test-pkgbuild/PKGBUILD << 'EOF'
          pkgname=test-package
          pkgver=1.0.0
          pkgrel=1
          pkgdesc="A test package"
          arch=('any')
          url="https://example.com"
          license=('MIT')
          source=()
          sha256sums=()
          package() {
            true
          }
          EOF

      - name: Run action with empty commit_username (expect failure)
        id: action_no_username
        uses: .
        continue-on-error: true
        with:
          pkgname: test-package
          pkgbuild: /tmp/test-pkgbuild/PKGBUILD
          commit_username: ""
          commit_email: "test@example.com"
          ssh_private_key: "dummy-key"
          commit_message: "Test commit"

      - name: Assert action failed due to missing commit_username
        env:
          OUTCOME: ${{ steps.action_no_username.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with empty commit_username, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with missing commit_username"
