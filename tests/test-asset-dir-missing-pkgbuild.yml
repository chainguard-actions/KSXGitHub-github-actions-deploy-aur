name: Test asset_dir must contain PKGBUILD
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create asset_dir without PKGBUILD
        run: |
          mkdir -p /tmp/test-asset-dir-no-pkgbuild
          echo "some content" > /tmp/test-asset-dir-no-pkgbuild/somefile.txt
      - name: Run action with asset_dir missing PKGBUILD (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          pkgname: 'test-pkg'
          asset_dir: '/tmp/test-asset-dir-no-pkgbuild'
          commit_username: 'Test User'
          commit_email: 'test@example.com'
          ssh_private_key: 'fake-key'
      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when asset_dir does not contain PKGBUILD"
            exit 1
          fi
          echo "PASS: action correctly failed when asset_dir is missing PKGBUILD"
