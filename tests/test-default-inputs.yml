name: Test default optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy PKGBUILD
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/pkgbuild"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/pkgbuild/PKGBUILD" <<'EOF'
          # Maintainer: Test User <test@example.com>
          pkgname=test-package
          pkgver=1.0.0
          pkgrel=1
          pkgdesc="A test package"
          arch=('any')
          url="https://example.com"
          license=('MIT')
          source=()
          sha256sums=()

          package() {
            true
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          pkgname: test-package
          pkgbuild: tests/fixtures/pkgbuild/PKGBUILD
          commit_username: Test User
          commit_email: test@example.com
          ssh_private_key: "not-a-valid-key"
          # Optional inputs using defaults:
          # updpkgsums: false (default)
          # test: false (default)
          # allow_empty_commits: false (default)
          # force_push: false (default)
          # commit_message: 'Update PKGBUILD and .SRCINFO with GitHub Actions' (default)
          # ssh_keyscan_types: 'rsa,ecdsa,ed25519' (default)

      - name: Assert action failed (expected - invalid SSH key, but defaults were accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of the invalid SSH key,
          # not because of missing/invalid optional inputs.
          # This confirms that default values are correctly applied.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid SSH key, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly processed default inputs and failed at SSH key step"
