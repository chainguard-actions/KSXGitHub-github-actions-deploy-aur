name: Test pkgbuild is required when asset_dir is not specified
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          pkgname: test-pkg
          # Neither pkgbuild nor asset_dir provided - should fail validation
          commit_username: Test User
          commit_email: test@example.com
          ssh_private_key: fake-key-for-validation-test

      - name: Assert action failed due to missing pkgbuild
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail because pkgbuild is empty and asset_dir is not set"
            exit 1
          fi
          echo "PASS: action correctly failed"
