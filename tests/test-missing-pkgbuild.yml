name: Test missing PKGBUILD handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with non-existent PKGBUILD path (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          pkgname: test-package
          pkgbuild: /nonexistent/path/PKGBUILD
          commit_username: "Test User"
          commit_email: "test@example.com"
          ssh_private_key: "this-is-not-a-valid-ssh-key"
          commit_message: "Test commit"

      - name: Assert action failed due to missing PKGBUILD
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: Expected action to fail with missing PKGBUILD, but it succeeded"
            exit 1
          fi
          echo "PASS: Action correctly failed with missing PKGBUILD"
