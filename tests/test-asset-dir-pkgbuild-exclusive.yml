name: Test asset_dir and pkgbuild are mutually exclusive
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy asset_dir with PKGBUILD under workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-asset-dir"
          printf 'pkgname=test-pkg\npkgver=1.0.0\npkgrel=1\npkgdesc="Test package"\narch=("any")\nurl="https://example.com"\nlicense=("MIT")\n' > "$GITHUB_WORKSPACE/test-asset-dir/PKGBUILD"

      - id: action
        uses: .
        continue-on-error: true
        with:
          pkgname: test-pkg
          pkgbuild: /github/workspace/test-asset-dir/PKGBUILD
          asset_dir: /github/workspace/test-asset-dir
          commit_username: Test User
          commit_email: test@example.com
          ssh_private_key: fake-key-for-validation-test

      - name: Assert action failed due to mutual exclusion
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to asset_dir and pkgbuild being mutually exclusive"
            exit 1
          fi
          echo "PASS: action correctly failed"
